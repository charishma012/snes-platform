<div id="bookmark-btn-{{ note.pk }}" class="inline-flex">
    {% if request.user.is_authenticated %}
        <button type="button"
                hx-post="{% url 'notes:toggle_bookmark' note.pk %}"
                hx-target="#bookmark-btn-{{ note.pk }}"
                hx-swap="outerHTML"
                aria-label="{% if request.user in note.bookmarked_by.all %}Remove from Study List{% else %}Save to Study List{% endif %}"
                title="{% if request.user in note.bookmarked_by.all %}In your Study List (Click to remove){% else %}Save to Study List{% endif %}"
                class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all duration-150 border shadow-xs {% if request.user in note.bookmarked_by.all %}bg-indigo-50 border-indigo-200 text-indigo-700 hover:bg-indigo-100{% else %}bg-white border-slate-200 text-slate-700 hover:bg-slate-50 hover:text-sky-600 hover:border-slate-300{% endif %}">
            {% if request.user in note.bookmarked_by.all %}
                <svg class="w-4 h-4 text-indigo-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                </svg>
                <span>Saved</span>
            {% else %}
                <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                </svg>
                <span>Save to Study List</span>
            {% endif %}
        </button>
    {% else %}
        <a href="{% url 'notes:login' %}?next={{ request.path }}"
           hx-post="{% url 'notes:toggle_bookmark' note.pk %}"
           hx-target="#bookmark-btn-{{ note.pk }}"
           hx-swap="outerHTML"
           aria-label="Login to save note"
           title="Sign in to save this note to your study list"
           class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:text-sky-600 hover:border-slate-300 transition-all duration-150 shadow-xs">
            <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
            </svg>
            <span>Save to Study List</span>
        </a>
    {% endif %}
</div>
