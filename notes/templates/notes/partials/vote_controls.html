<div id="vote-controls-{{ note.pk }}" class="inline-flex items-center space-x-1 bg-slate-100/90 p-1 rounded-xl border border-slate-200 shadow-xs">
    <!-- Upvote Button -->
    {% if request.user.is_authenticated %}
        <button type="button"
                hx-post="{% url 'notes:toggle_upvote' note.pk %}"
                hx-target="#vote-controls-{{ note.pk }}"
                hx-swap="outerHTML"
                aria-label="Upvote"
                title="{% if request.user in note.upvoted_by.all %}Remove upvote{% else %}Upvote this note{% endif %}"
                class="p-1.5 rounded-lg text-xs font-semibold transition-all duration-150 flex items-center justify-center {% if request.user in note.upvoted_by.all %}bg-emerald-500 text-white shadow-xs hover:bg-emerald-600{% else %}text-slate-500 hover:text-emerald-600 hover:bg-emerald-50{% endif %}">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
            </svg>
        </button>
    {% else %}
        <a href="{% url 'notes:login' %}?next={{ request.path }}"
           hx-post="{% url 'notes:toggle_upvote' note.pk %}"
           hx-target="#vote-controls-{{ note.pk }}"
           hx-swap="outerHTML"
           aria-label="Login to upvote"
           title="Sign in to upvote"
           class="p-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-emerald-600 hover:bg-emerald-50 transition-all duration-150 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
            </svg>
        </a>
    {% endif %}

    <!-- Vote Score Display -->
    <span class="px-2 text-xs font-extrabold min-w-[28px] text-center {% if note.vote_score > 0 %}text-emerald-700{% elif note.vote_score < 0 %}text-rose-700{% else %}text-slate-700{% endif %}" title="Community Vote Score">
        {{ note.vote_score }}
    </span>

    <!-- Downvote Button -->
    {% if request.user.is_authenticated %}
        <button type="button"
                hx-post="{% url 'notes:toggle_downvote' note.pk %}"
                hx-target="#vote-controls-{{ note.pk }}"
                hx-swap="outerHTML"
                aria-label="Downvote"
                title="{% if request.user in note.downvoted_by.all %}Remove downvote{% else %}Downvote this note{% endif %}"
                class="p-1.5 rounded-lg text-xs font-semibold transition-all duration-150 flex items-center justify-center {% if request.user in note.downvoted_by.all %}bg-rose-500 text-white shadow-xs hover:bg-rose-600{% else %}text-slate-500 hover:text-rose-600 hover:bg-rose-50{% endif %}">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
        </button>
    {% else %}
        <a href="{% url 'notes:login' %}?next={{ request.path }}"
           hx-post="{% url 'notes:toggle_downvote' note.pk %}"
           hx-target="#vote-controls-{{ note.pk }}"
           hx-swap="outerHTML"
           aria-label="Login to downvote"
           title="Sign in to downvote"
           class="p-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-rose-600 hover:bg-rose-50 transition-all duration-150 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
        </a>
    {% endif %}
</div>
